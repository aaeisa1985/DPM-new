name: DPM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff Check & Format
        run: |
          ruff check backend tests
          ruff format --check backend tests

      - name: Mypy Type Check
        run: |
          mypy backend --ignore-missing-imports

      - name: Pytest with Coverage
        run: |
          pytest --cov=backend/app/engines --cov-fail-under=90 --cov-report=term-missing

      - name: Dependency Vulnerability Audit
        run: |
          pip-audit -r requirements.txt

      - name: License Audit (No AGPL/GPL/Affero)
        run: |
          pip-licenses --fail-on "AGPL;Affero;GNU General Public License" --partial-match
