line-length = 110
target-version = "py312"

[lint]
select = ["E", "F", "I", "W", "UP"]
ignore = [
    "B008",    # FastAPI Depends() in parameter defaults
    "E501",    # line length
    "E402",    # module level import not at top (needed for sys.path bootstrap)
    "UP007",   # X | Y union types
    "F841",    # local variable assigned but never used in test fixtures
]

[lint.isort]
known-first-party = ["app"]

